# Towns people can choose when they report a price (src/market/reports.py). The first town is the main commercial
# city (shown as "the capital" in typical prices); every other choice counts as "elsewhere". "Elsewhere in <country>"
# is always offered too. iso2 is the country code Cloudflare reports for a visitor (reports sent from another
# country are held for review).
