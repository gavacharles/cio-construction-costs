# Public site settings (src/site/build_index.py).
# WhatsApp Business number in international format, digits only (e.g. 256700123456).
# When set, the site shows "Chat with us on WhatsApp" buttons (wa.me click-to-chat links).
whatsapp_number: ""
# Countries shown first in "Costs at a glance" (the rest sit behind "Show all").
glance_featured: [uganda, kenya, south_africa, nigeria, ghana]
# Free WhatsApp Channel link (WhatsApp Business app > Updates > Channels > create > share link).
# When set, the site shows "Follow on WhatsApp (free)" buttons. Post the weekly note text there:
# countries/<country>/notes/weekly_<country>_<date>.txt is ready to paste.
whatsapp_channel_url: "https://whatsapp.com/channel/0029Vb9aFCqHLHQab6WSC43L"
# Paid WhatsApp alerts (Cloud API) are off: alert sign-ups offer email only until this is true.
alerts_whatsapp: false
# Public address of the site, used in the website-widget code (CIO_SITE_URL on the server overrides it).
site_url: ""
# Pilot (first 3 months): only these countries (plus the benchmark) appear on the site; the monthly
# pilot report covers them. Add the other countries here when expanding.
pilot_countries: [uganda, south_africa, kenya, rwanda, zambia, tanzania, nigeria]
# Benchmark country (global north): same forecasting tool on timely official data, to show how it performs.
benchmark_countries: [united_states, united_kingdom, austria, hong_kong, philippines, brazil]
